name: Daily IT Trend Notifier (Gmail)

on:
  schedule:
  # 매일 UTC 13:05 (한국 시간 KST 밤 10:05) 실행
    - cron: '15 13 * * *'
  # GitHub 웹 화면에서 수동으로 실행 테스트 가능
  workflow_dispatch:

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v5  # 또는 @main

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11' # 최신 라이브러리와의 호환성을 위해 3.11 권장

      - name: 패키지 설치
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 스크립트 실행 및 Gmail 발송
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          TO_EMAIL: ${{ secrets.TO_EMAIL }}
        run: |
          python main.py
